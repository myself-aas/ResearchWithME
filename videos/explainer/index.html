<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"paper_title","type":"string","label":"Paper Title","default":"Deconstructing DeepSeek-R1"},
    {"id":"paper_format","type":"string","label":"Format Badge","default":"Paper Review"},
    {"id":"author_name","type":"string","label":"Author","default":"Prof. Marcus Vance · University of Cambridge"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --amber: #78350f;
        --parchment: #fafaf9;
        --ink: #1c1917;
        --muted: #78716c;
        --accent: #047857;
        --border: #e7e5e4;
        --gold: #b45309;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--parchment);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-title"
        data-composition-id="scene-title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-problem"
        data-composition-id="scene-problem"
        data-composition-src="compositions/problem.html"
        data-start="9"
        data-duration="15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-finding"
        data-composition-id="scene-finding"
        data-composition-src="compositions/finding.html"
        data-start="24"
        data-duration="18"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-method"
        data-composition-id="scene-method"
        data-composition-src="compositions/method.html"
        data-start="42"
        data-duration="15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-takeaways"
        data-composition-id="scene-takeaways"
        data-composition-src="compositions/takeaways.html"
        data-start="57"
        data-duration="18"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
