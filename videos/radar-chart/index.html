<!doctype html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="../tokens/generated/tokens.video.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --amber:     var(--reme-video-color-text-primary);
        --parchment: var(--reme-video-color-canvas);
        --ink:       var(--reme-video-color-text-primary);
        --muted:     var(--reme-video-color-text-secondary);
        --border:    var(--reme-video-color-surface-subtle);
        --accent:    var(--reme-video-color-text-secondary);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--parchment);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--reme-video-font-latin-interface);
      }

      /* Background */
      #rc-bg {
        position: absolute;
        inset: 0;
        background: var(--parchment);
      }

      /* Chart container — centered left half */
      #rc-chart {
        position: absolute;
        left: 160px;
        top: 50%;
        width: 700px;
        height: 700px;
        transform: translate(0, -50%);
      }

      /* Info panel — right */
      #rc-panel {
        position: absolute;
        right: 160px;
        top: 50%;
        width: 640px;
        transform: translate(0, -50%);
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      #rc-author-name {
        font-family: var(--reme-video-font-latin-editorial);
        font-size: 52px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.15;
        margin-bottom: 8px;
      }
      #rc-author-role {
        font-family: var(--reme-video-font-latin-interface);
        font-size: 20px;
        font-weight: 400;
        color: var(--muted);
        margin-bottom: 48px;
      }
      #rc-metrics {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .rc-metric {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .rc-metric-label {
        font-family: var(--reme-video-font-latin-interface);
        font-size: 17px;
        font-weight: 500;
        color: var(--ink);
        width: 220px;
        flex-shrink: 0;
      }
      .rc-metric-bar-track {
        flex: 1;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .rc-metric-bar-fill {
        height: 100%;
        background: var(--amber);
        border-radius: 3px;
        transform-origin: left center;
        width: 100%;
        transform: scaleX(0);
      }
      .rc-metric-value {
        font-family: var(--reme-video-font-latin-interface);
        font-size: 17px;
        font-weight: 700;
        color: var(--amber);
        width: 36px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #rc-rule {
        width: 60px;
        height: 3px;
        background: var(--amber);
        border-radius: 2px;
        margin-top: 48px;
        transform-origin: left center;
        /* GSAP owns the transform; no CSS transform here */
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="rc-bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>

      <!-- SVG radar chart -->
      <div id="rc-chart" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <svg id="rc-svg" viewBox="0 0 700 700" width="700" height="700" overflow="visible">
          <!-- Grid rings -->
          <g id="rc-rings" opacity="0">
            <polygon points="350,150 557,275 557,425 350,550 143,425 143,275" fill="none" stroke="var(--reme-video-color-surface-subtle)" stroke-width="1.5"/>
            <polygon points="350,200 520,300 520,400 350,500 180,400 180,300" fill="none" stroke="var(--reme-video-color-surface-subtle)" stroke-width="1.5"/>
            <polygon points="350,250 483,325 483,375 350,450 217,375 217,325" fill="none" stroke="var(--reme-video-color-surface-subtle)" stroke-width="1.5"/>
            <polygon points="350,300 446,350 446,350 350,400 254,350 254,350" fill="none" stroke="var(--reme-video-color-surface-subtle)" stroke-width="1.5"/>
          </g>

          <!-- Axis lines -->
          <g id="rc-axes" stroke="var(--reme-video-color-surface-subtle)" stroke-width="1.5" opacity="0">
            <line x1="350" y1="350" x2="350" y2="110"/>   <!-- top: Article Quality -->
            <line x1="350" y1="350" x2="582" y2="258"/>   <!-- top-right: Community -->
            <line x1="350" y1="350" x2="582" y2="442"/>   <!-- bottom-right: Methodology -->
            <line x1="350" y1="350" x2="350" y2="590"/>   <!-- bottom: Citation -->
            <line x1="350" y1="350" x2="118" y2="442"/>   <!-- bottom-left: Transparency -->
          </g>

          <!-- Data polygon — drawn via clip-path animation -->
          <!-- Metrics: AQ=87, CE=72, MR=91, CI=68, OT=95 (max=100, radius range 100–240) -->
          <!-- Point calculation: centre 350,350; max radius 240; each axis angle: 90°, 18°, 306°, 234°, 162° -->
          <!-- AQ=87: r=208.8 → (350, 350-208.8) = (350, 141.2) -->
          <!-- CE=72: r=172.8 → (350+172.8·cos(18°), 350-172.8·sin(18°)) = (514.4, 296.6) -->
          <!-- MR=91: r=218.4 → (350+218.4·cos(306°), 350-218.4·sin(306°)) = (478.4, 526.8) -->
          <!-- CI=68: r=163.2 → (350+163.2·cos(234°), 350-163.2·sin(234°)) = (253.9, 482.0) -->
          <!-- OT=95: r=228 → (350+228·cos(162°), 350-228·sin(162°)) = (133.1, 279.6) -->
          <polygon
            id="rc-data-poly"
            points="350,141.2 514.4,296.6 478.4,526.8 253.9,482.0 133.1,279.6"
            fill="var(--reme-video-color-text-primary)"
            fill-opacity="0.15"
            stroke="var(--reme-video-color-text-primary)"
            stroke-width="2.5"
            stroke-linejoin="round"
            opacity="0"
          />

          <!-- Axis dots (one per metric, filled once visible) -->
          <g id="rc-dots">
            <circle id="rc-dot-0" cx="350"   cy="141.2" r="6" fill="var(--reme-video-color-text-primary)" opacity="0"/>
            <circle id="rc-dot-1" cx="514.4" cy="296.6" r="6" fill="var(--reme-video-color-text-primary)" opacity="0"/>
            <circle id="rc-dot-2" cx="478.4" cy="526.8" r="6" fill="var(--reme-video-color-text-primary)" opacity="0"/>
            <circle id="rc-dot-3" cx="253.9" cy="482.0" r="6" fill="var(--reme-video-color-text-primary)" opacity="0"/>
            <circle id="rc-dot-4" cx="133.1" cy="279.6" r="6" fill="var(--reme-video-color-text-primary)" opacity="0"/>
          </g>

          <!-- Axis labels -->
          <g id="rc-labels" font-family="Inter, sans-serif" font-size="18" fill="var(--reme-video-color-text-secondary)" text-anchor="middle">
            <text id="rc-lbl-0" x="350"   y="96"  opacity="0">Article Quality</text>
            <text id="rc-lbl-1" x="562"   y="280" text-anchor="start" opacity="0">Community</text>
            <text id="rc-lbl-2" x="562"   y="544" text-anchor="start" opacity="0">Methodology</text>
            <text id="rc-lbl-3" x="350"   y="624" opacity="0">Citation Impact</text>
            <text id="rc-lbl-4" x="125"   y="280" text-anchor="end" opacity="0">Transparency</text>
          </g>
        </svg>
      </div>

      <!-- Right panel -->
      <div id="rc-panel" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <div id="rc-author-name">Prof. Marcus Vance</div>
        <div id="rc-author-role">AI Systems &amp; Verification Fellow · Cambridge</div>
        <div id="rc-metrics">
          <div class="rc-metric" id="rc-m0">
            <div class="rc-metric-label">Article Quality</div>
            <div class="rc-metric-bar-track"><div class="rc-metric-bar-fill" id="rc-bar-0" style="transform:scaleX(0)"></div></div>
            <div class="rc-metric-value" id="rc-val-0">0</div>
          </div>
          <div class="rc-metric" id="rc-m1">
            <div class="rc-metric-label">Community</div>
            <div class="rc-metric-bar-track"><div class="rc-metric-bar-fill" id="rc-bar-1" style="transform:scaleX(0)"></div></div>
            <div class="rc-metric-value" id="rc-val-1">0</div>
          </div>
          <div class="rc-metric" id="rc-m2">
            <div class="rc-metric-label">Methodology Rigor</div>
            <div class="rc-metric-bar-track"><div class="rc-metric-bar-fill" id="rc-bar-2" style="transform:scaleX(0)"></div></div>
            <div class="rc-metric-value" id="rc-val-2">0</div>
          </div>
          <div class="rc-metric" id="rc-m3">
            <div class="rc-metric-label">Citation Impact</div>
            <div class="rc-metric-bar-track"><div class="rc-metric-bar-fill" id="rc-bar-3" style="transform:scaleX(0)"></div></div>
            <div class="rc-metric-value" id="rc-val-3">0</div>
          </div>
          <div class="rc-metric" id="rc-m4">
            <div class="rc-metric-label">Open Transparency</div>
            <div class="rc-metric-bar-track"><div class="rc-metric-bar-fill" id="rc-bar-4" style="transform:scaleX(0)"></div></div>
            <div class="rc-metric-value" id="rc-val-4">0</div>
          </div>
        </div>
        <div id="rc-rule"></div>
      </div>
    </div>
    <script>
      const METRICS = [87, 72, 91, 68, 95];

      const tl = gsap.timeline({ paused: true });

      // Panel fades in
      tl.fromTo("#rc-author-name",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" },
        0.1
      );
      tl.fromTo("#rc-author-role",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.4
      );

      // Grid and axes fade
      tl.fromTo("#rc-rings",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        0.2
      );
      tl.fromTo("#rc-axes",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        0.35
      );

      // Each metric arm draws sequentially — dot appears, then bar fills, then value counts up
      const dotIds  = ["#rc-dot-0","#rc-dot-1","#rc-dot-2","#rc-dot-3","#rc-dot-4"];
      const lblIds  = ["#rc-lbl-0","#rc-lbl-1","#rc-lbl-2","#rc-lbl-3","#rc-lbl-4"];
      const barIds  = ["#rc-bar-0","#rc-bar-1","#rc-bar-2","#rc-bar-3","#rc-bar-4"];
      const valIds  = ["#rc-val-0","#rc-val-1","#rc-val-2","#rc-val-3","#rc-val-4"];
      const rowIds  = ["#rc-m0","#rc-m1","#rc-m2","#rc-m3","#rc-m4"];

      // Data polygon draws in last
      // We animate it from opacity 0 to 1 after all arms appear
      METRICS.forEach((val, i) => {
        const startAt = 0.6 + i * 0.62;
        const target  = val / 100;

        // Row fades
        tl.fromTo(rowIds[i],
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          startAt
        );

        // Dot pops on chart
        tl.fromTo(dotIds[i],
          { opacity: 0, scale: 0, transformOrigin: "center" },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" },
          startAt + 0.05
        );

        // Label fades
        tl.fromTo(lblIds[i],
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          startAt + 0.15
        );

        // Bar fills
        tl.to(barIds[i],
          { scaleX: target, duration: 0.6, ease: "power2.out" },
          startAt + 0.1
        );

        // Value counts up — fromTo with 4 args (targets, fromVars, toVars, position)
        const el = document.querySelector(valIds[i]);
        const proxy = { v: 0 };
        tl.fromTo(proxy,
          { v: 0 },
          { v: val, duration: 0.55, ease: "power2.out",
            onUpdate: function() { el.textContent = Math.round(proxy.v); } },
          startAt + 0.1
        );
      });

      // Data polygon appears once all arms are drawn
      tl.fromTo("#rc-data-poly",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        4.5
      );

      // Rule draws — fromTo so GSAP owns the full transform from frame 0
      tl.fromTo("#rc-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        4.7
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
