name: Quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (canonical lockfile)
        run: npm ci

      - name: Design tokens (build, validate, contrast)
        run: npm run tokens:build && npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (schema, loader, TOC, every post compiles as MDX)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test the built site
        run: |
          npx next start -H 127.0.0.1 -p 3100 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/ > /dev/null && break
            sleep 1
          done
          for route in / /posts /tags /about /search /rss.xml /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3100$route")
            echo "$route $code"
            test "$code" = "200"
          done
