name: Quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (canonical lockfile)
        run: npm ci

      - name: Published content snapshot
        run: npm run content:verify

      - name: Manifest design system (determinism and token boundary)
        run: npm run design:check

      - name: Design tokens (build, validate, contrast)
        run: npm run tokens:build && npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (schema, loader, TOC, every post compiles as MDX)
        run: npm test

      - name: Production build
        run: npm run build

      # §14 of AGENTS.md, executed against the artifacts that ship: one h1 per
      # page, unique titles and descriptions, canonical == final URL, JSON-LD
      # resolved by @id, no orphans, sitemap ↔ page parity, feeds and
      # machine-readable artifacts present, JS/CSS budgets.
      - name: Definition of done (SEO / AEO / GEO contract)
        run: npm run check:site

      - name: Install browser for design conformance checks
        run: npx playwright install --with-deps chromium

      - name: Smoke test and browser-check the built site
        run: npm run test:production

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-browser-failures
          path: test-results/design/
          if-no-files-found: ignore
          retention-days: 7

  workers:
    name: Workers build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKERS_CI: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p artifacts/worker-checks
      - name: Build with the Workers CI entry point
        run: npm run build 2>&1 | tee artifacts/worker-checks/build.log
      - name: Package without deploying and enforce artifact limits
        run: npm run check:worker 2>&1 | tee artifacts/worker-checks/package.log
      - name: Validate every font face and scientific glyph coverage
        run: |
          python3 -m venv /tmp/reme-font-check
          /tmp/reme-font-check/bin/pip install 'fonttools[woff]==4.69.1'
          /tmp/reme-font-check/bin/python scripts/design/fonts.py --check
      - run: npx playwright install --with-deps chromium
      - name: Cold-cache content, search, assistant and browser checks in workerd
        run: npm run test:worker 2>&1 | tee artifacts/worker-checks/runtime.log
      - name: Keep Worker build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workers-build-and-runtime-${{ github.event_name }}
          path: |
            artifacts/worker-checks/
            test-results/design/
          if-no-files-found: ignore
          retention-days: 7
