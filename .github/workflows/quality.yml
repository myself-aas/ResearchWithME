name: Quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (canonical lockfile)
        run: npm ci
      - name: Token pipeline gates (build, validate, contrast)
        run: npm run tokens:build && npm run tokens:check
      - name: Lint, typecheck, tests, Impeccable source scan
        run: npm run lint && npm run typecheck && npm run test && npm run impeccable:source
      - name: Protocol, DNS-AID, WebMCP, and Assistant Worker checks
        run: npm run dns:test && npm run webmcp:test && npm run worker:assistant:check
      - name: Python CLI product tests
        run: python3 -m unittest discover -s products/tests -p 'test_*.py'
      - name: reme offline draft & v3.4 backfill dry-run checks
        run: npm run reme:check && npm run reme:test && node scripts/v34-backfill-reconcile.mjs --dry-run
      - name: Production build
        run: npm run build
      - name: Performance budgets (§18)
        run: npm run budgets
      - name: Release gate machine checks (§44/§46)
        run: npm run release:gate

  v34-e2e-a11y:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies & Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build production server
        run: npm run build
      - name: Run live v3.4 SLO audit & Playwright axe/reflow matrix (320–1920px)
        run: |
          npx next start -H 127.0.0.1 -p 3100 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/feed > /dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 node scripts/verify-v34-live.mjs
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 npx playwright test test/e2e/v34-a11y-reflow.spec.ts
