  <script>
    const tl = gsap.timeline({ paused: true });
    const words = gsap.utils.toArray("#masthead-headline .word");

    // Structure first: the page's grid draws down, then the masthead rule prints.
    // The page is already printed at frame 0 — ground, hairlines, masthead rule
    // and wordmark. That frame is also the film's thumbnail.
    tl.fromTo(
      "#masthead-brand",
      { opacity: 1 },
      { opacity: 1, duration: 0.1, ease: "none" },
      0,
    );
    tl.fromTo(
      "#masthead-site",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power4.out" },
      0.5,
    );

    // The headline arrives word by word on the narration's first line.
    tl.fromTo(
      words,
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.085 },
      0.95,
    );

    tl.fromTo("#masthead-hair", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 1.95);
    tl.fromTo(
      "#masthead-tagline",
      { opacity: 0, filter: "blur(4px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out" },
      2.1,
    );

    // Hands off: the words blur out (exits run ~45% of their entrance), the page
    // structure stays so the record scene can rise into it.
    tl.to(
      words,
      { opacity: 0, filter: "blur(5px)", duration: 0.22, ease: "power3.in", stagger: 0.014 },
      4.28,
    );
    tl.to("#masthead-tagline", { opacity: 0, filter: "blur(4px)", duration: 0.2, ease: "power3.in" }, 4.44);
    tl.to("#masthead-hair", { scaleX: 0, duration: 0.24, ease: "power3.in" }, 4.5);

    window.__timelines["masthead"] = tl;
    tl.seek(0);
  </script>
