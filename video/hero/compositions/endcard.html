  <script>
    const tl = gsap.timeline({ paused: true });

    // Object becomes the world: the citation sheet is wiped away by the film's own paper.
    tl.fromTo("#endcard-wipe", { x: 1920 }, { x: 0, duration: 0.26, ease: "power3.inOut" }, 0.02);
    tl.to("#endcard-wipe", { opacity: 0, duration: 0.14, ease: "none" }, 0.22);

    // The mark is performed: the rule prints, then the wordmark lands letter by letter.

    tl.fromTo("#endcard-bar-b", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.1);
    tl.fromTo(

      { opacity: 0, y: 16, filter: "blur(6px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", stagger: 0.06 },
      0.1,

    tl.fromTo("#endcard-url", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.42, ease: "power3.inOut" }, 0.96);
    tl.fromTo("#endcard-licence", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, 1.2);

    // Audio-reactive: the two stressed words of the closing line pulse the mark and the licence.
    tl.fromTo("#endcard-wordmark", { scale: 1.03 }, { scale: 1, duration: 0.46, ease: "sine.out" }, 1.32);
    tl.fromTo("#endcard-licence", { scale: 1.04 }, { scale: 1, duration: 0.46, ease: "sine.out" }, 3.31);

    window.__timelines["endcard"] = tl;
    tl.seek(0);
