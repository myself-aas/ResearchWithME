<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="𝞹">
  <style>
    .glyph { fill: #78350f; }
    @media (prefers-color-scheme: dark) {
      .glyph { fill: #fbbf24; }
    }
  </style>
  <defs>
    <clipPath id="rounded-corners">
      <rect width="64" height="64" rx="10" ry="10"/>
    </clipPath>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#rounded-corners)">
    <text class="glyph" x="32" y="47" text-anchor="middle" font-family="'Aptos Serif', Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" filter="url(#soft-shadow)">𝞹</text>
  </g>
</svg>
